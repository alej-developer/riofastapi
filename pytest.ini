# ============================================================
# pytest.ini - Configuracion central de pytest
# ============================================================
# Este archivo configura el comportamiento global de pytest
# para el proyecto. Centraliza opciones que de otro modo
# habria que pasar por linea de comandos en cada ejecucion.

[pytest]
# Directorio donde pytest buscara los archivos de test
testpaths = tests

# Nivel minimo de mensajes de log que se capturan durante los tests
log_cli_level = INFO

# Modo de ejecucion para funciones async (requerido por pytest-asyncio)
asyncio_mode = auto

# Opciones por defecto al ejecutar pytest:
#   -v        Salida detallada (verbose): muestra el nombre de cada test
#   --tb=short Tracebacks cortos en caso de fallo (mas legibles)
addopts = -v --tb=short
